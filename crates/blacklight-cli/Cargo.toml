[package]
name = "blacklight-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "blacklight-cli"
path = "src/main.rs"

[dependencies]
alloy = { version = "1.1", features = ["contract", "providers", "signers", "signer-local", "sol-types"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dotenv = "0.15"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

blacklight-contract-clients = { path = "../blacklight-contract-clients" }
contract-clients-common = { path = "../contract-clients-common" }
