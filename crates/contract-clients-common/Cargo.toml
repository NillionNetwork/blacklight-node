[package]
name = "contract-clients-common"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
alloy = { version = "1.1", features = ["contract", "providers", "pubsub"] }
alloy-provider = { version = "1.1", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1.49", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
alloy = { version = "1.1", features = ["contract", "providers", "pubsub"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "time", "sync"] }
