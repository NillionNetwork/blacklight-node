global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'blacklight-metrics'
    static_configs:
      - targets: ['metrics-exporter:9090']
    scrape_interval: 5s
    metrics_path: /metrics
